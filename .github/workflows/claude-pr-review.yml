name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Review pull request
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            BASE: ${{ github.event.pull_request.base.sha }}
            PREVIOUS HEAD: ${{ github.event.before }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request (Kotlin / Jetpack Compose project). Follow CLAUDE.md and the docs it points to.

            Scope: if EVENT is "synchronize", review only `git diff PREVIOUS_HEAD..HEAD` and check whether your earlier findings on this PR (see `gh pr view --comments`) were addressed. Otherwise review `git diff BASE...HEAD`.

            Review for:
            - Compose best practices: state hoisting, stability/recomposition, remember/derivedStateOf, side-effect keys, Modifier parameter conventions, lifecycle-aware collection, previews, accessibility.
            - Potential bugs: null/edge cases, coroutine scope misuse, races, leaks, error handling.
            - Clean code: naming, function size, duplication, dead code, magic values.
            - Clean architecture: layer boundaries, dependency direction, ViewModel/use case/repository responsibilities, module coupling.
            - Craftsmanship: tests for new logic, SOLID, testability.

            Report only findings worth acting on; no praise, no lint-level nitpicks. One or two sentences each, with a concrete fix (use a suggestion block where it fits).

            Posting:
            1. Each code finding as an inline comment on the changed line (mcp__github_inline_comment__create_inline_comment).
            2. Architecture issues as one general comment titled "Architecture" (`gh pr comment`). Skip if none.
            3. Always end with one general comment on the final state in 2–4 lines: verdict (ready to merge / needs changes), findings by severity, and on updates which earlier findings are resolved.

            Never approve, request changes, push or edit code.
